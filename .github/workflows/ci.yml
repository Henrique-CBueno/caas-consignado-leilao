name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-system-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew help --no-daemon
      - name: Validar docker-compose de desenvolvimento
        run: docker compose -f infra/docker/docker-compose.dev.yml config

# Etapas de lint/testes/build de imagem/terraform/deploy entram a partir da Milestone 1,
# conforme código real de serviço é adicionado (ver plano de implementação).
