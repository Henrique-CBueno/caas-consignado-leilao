name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4
      - name: Validar docker-compose de desenvolvimento
        run: docker compose -f infra/docker/docker-compose.dev.yml config
      # Testes de integração usam Testcontainers (Postgres, cognito-local) — runners
      # ubuntu-latest do GitHub já vêm com Docker.
      - run: ./gradlew test --no-daemon

# Lint dedicado (ktlint) fica pendente — bug conhecido do plugin nesta combinação
# de versões (ver build.gradle.kts raiz). Build de imagem/terraform/deploy entram
# quando esses componentes existirem (ver plano de implementação).
