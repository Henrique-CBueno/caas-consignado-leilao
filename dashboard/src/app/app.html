<header>
  @if (feed.demo) {
    <span class="demo-badge">Modo demonstração</span>
  }
  <nav aria-label="Principal">
    <a routerLink="/">Ao vivo</a>
    <a routerLink="/historico">Histórico</a>
  </nav>
  <button type="button" (click)="themeService.toggle()">Alternar tema</button>
  <span class="status" role="status" [class.status--connected]="connection() === 'connected'">
    {{ connectionLabel() }}
  </span>
</header>

<main>
  <router-outlet />
</main>
