<header class="bar">
  <span class="brand">CaaS Leilão</span>

  <nav aria-label="Principal">
    <a routerLink="/" routerLinkActive="current" [routerLinkActiveOptions]="{ exact: true }">Ao vivo</a>
    <a routerLink="/historico" routerLinkActive="current">Histórico</a>
    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="current">Administração</a>
    } @else if (auth.tenant(); as tenant) {
      <a routerLink="/nova-proposta" routerLinkActive="current">Nova proposta</a>
    }
  </nav>

  <div class="bar-tools">
    @if (auth.tenant(); as tenant) {
      <span class="tenant">{{ tenant }}</span>
      <button type="button" (click)="auth.logout()">Sair</button>
    } @else {
      <a class="tool-link" routerLink="/entrar" routerLinkActive="current">Entrar</a>
    }
    @if (feed.demo) {
      <span class="demo-badge">Modo demonstração</span>
    }
    <span class="status" role="status" [attr.data-state]="connection()">
      <i class="status-mark" aria-hidden="true"></i>{{ connectionLabel() }}
    </span>
    @if (!feed.demo) {
      <a class="tool-link" [href]="trace">Trace</a>
      <a class="tool-link" [href]="metrics">Métricas</a>
    }
    <button type="button" (click)="themeService.toggle()">Alternar tema</button>
  </div>
</header>

<main>
  <router-outlet />
</main>
