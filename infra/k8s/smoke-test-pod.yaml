apiVersion: v1
kind: Pod
metadata:
  name: smoke-test
  namespace: caas
spec:
  restartPolicy: Never
  containers:
    - name: smoke-test
      image: curlimages/curl:latest
      command: ["sh", "/scripts/smoke-test.sh"]
      env:
        - name: CHECK_OBSERVABILITY
          value: "CHECK_OBSERVABILITY_VALUE"
      volumeMounts:
        - name: script
          mountPath: /scripts
  volumes:
    - name: script
      configMap:
        name: smoke-test-script
        defaultMode: 0755
