# Jaeger all-in-one com storage em memória: sem persistência (limitação conhecida, ADR-0011).
# Recebe traces por OTLP/HTTP (4318) direto dos serviços, sem OpenTelemetry Collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: caas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: MEMORY_MAX_TRACES
              value: "5000"
          ports:
            - containerPort: 16686
            - containerPort: 4318
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: caas
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686
    - name: otlp-http
      port: 4318
      targetPort: 4318
