apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: caas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: caas/api-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m -XX:+UseSerialGC"
            - name: APP_ROUTES_TENANT_SERVICE_URI
              value: http://tenant-service:8080
            - name: APP_ROUTES_PROPOSAL_SERVICE_URI
              value: http://proposal-service:8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: caas
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
