apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-service
  namespace: caas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auction-service
  template:
    metadata:
      labels:
        app: auction-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: auction-service
          image: caas/auction-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m -XX:+UseSerialGC"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger:4318/v1/traces
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: APP_DYNAMODB_ENDPOINT
              value: http://localstack:4566
            - name: APP_DYNAMODB_REGION
              value: us-east-1
            - name: APP_DYNAMODB_ACCESS_KEY
              value: test
            - name: APP_DYNAMODB_SECRET_KEY
              value: test
            - name: APP_AUCTION_WINDOW_SECONDS
              value: "30"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auction-service
  namespace: caas
spec:
  selector:
    app: auction-service
  ports:
    - port: 8080
      targetPort: 8080
