apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-service
  namespace: caas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contract-service
  template:
    metadata:
      labels:
        app: contract-service
    spec:
      containers:
        - name: contract-service
          image: caas/contract-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-contract-service:5432/caas
            - name: SPRING_DATASOURCE_USERNAME
              value: caas
            - name: SPRING_DATASOURCE_PASSWORD
              value: caas
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: contract-service
  namespace: caas
spec:
  selector:
    app: contract-service
  ports:
    - port: 8080
      targetPort: 8080
