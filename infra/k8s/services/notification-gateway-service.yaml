apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-gateway-service
  namespace: caas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-gateway-service
  template:
    metadata:
      labels:
        app: notification-gateway-service
    spec:
      containers:
        - name: notification-gateway-service
          image: caas/notification-gateway-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m -XX:+UseSerialGC"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          readinessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 5
---
# NodePort fixa (30086): o dashboard conecta direto no navegador via WebSocket,
# sem passar pelo api-gateway — ver app.ts (Milestone 9).
apiVersion: v1
kind: Service
metadata:
  name: notification-gateway-service
  namespace: caas
spec:
  type: NodePort
  selector:
    app: notification-gateway-service
  ports:
    - port: 8086
      targetPort: 8086
      nodePort: 30086
