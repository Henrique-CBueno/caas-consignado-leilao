# credit-analysis-service só consome Kafka e faz JPA: o starter-web existe apenas para
# expor o Actuator (métricas Prometheus, porta 8080) — por isso sem readinessProbe/Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-analysis-service
  namespace: caas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-analysis-service
  template:
    metadata:
      labels:
        app: credit-analysis-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: credit-analysis-service
          image: caas/credit-analysis-service:local
          imagePullPolicy: Never
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m -XX:+UseSerialGC"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger:4318/v1/traces
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-credit-analysis-service:5432/caas
            - name: SPRING_DATASOURCE_USERNAME
              value: caas
            - name: SPRING_DATASOURCE_PASSWORD
              value: caas
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
